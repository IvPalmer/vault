services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vault_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET}
      PLUGGY_PROFILES: ${PLUGGY_PROFILES:-}
      # Shared secret for server-to-server calls (X-Internal-Token), checked in
      # api/middleware.py. The API requires auth (JWT) for everyone else. The
      # chat-sidecar was its only caller until it was removed; the mechanism
      # stays because the middleware and its tests still depend on it.
      VAULT_INTERNAL_TOKEN: ${VAULT_INTERNAL_TOKEN:-}
    volumes:
      - vault_static:/app/staticfiles
      - vault_secrets:/app/secrets
    entrypoint: ["sh", "/app/entrypoint.sh"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    depends_on:
      - backend
    volumes:
      # Exam media (e.g. the ultrasound video) served as static files with
      # native nginx byte-range support — reliable <video> playback without the
      # streaming proxy. Host path lives outside the git checkout, so the media
      # is not baked into the image/history and survives deploys.
      - ${EXAM_MEDIA_PATH:-/home/ubuntu/vault-exam-media}:/usr/share/nginx/exam-media:ro

  cron:
    build: ./backend
    restart: always
    depends_on:
      - db
      - backend
    environment:
      DEBUG: "0"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET}
      PLUGGY_PROFILES: ${PLUGGY_PROFILES:-}
      SYNC_PROFILES: ${SYNC_PROFILES:-Palmer,Rafa}
      # UTC. The MeuPluggy items refresh on Pluggy's own schedule — measured at
      # 19:15-19:17 (Rafa) and 19:21-19:23 (Palmer) — and PATCH /items/{id} is
      # refused for that connector, so neither this job nor the Sync button in
      # Settings can pull a transaction the aggregator has not fetched yet. At
      # 08:00 the pipeline always read the previous evening's snapshot, and the
      # last two days looked missing every single morning. 20:15 lands after the
      # refresh with room for it to run late.
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-15 20 * * *}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update -qq && apt-get install -y -qq cron > /dev/null 2>&1
        # cron builds a minimal environment for jobs, so none of this service's
        # vars (Pluggy creds, PLUGGY_PROFILES, Postgres, SECRET_KEY) reach them
        # on their own — without this the jobs die on "Missing PLUGGY_CLIENT_ID".
        # Dump what the commands need, shell-quoted (PLUGGY_PROFILES is JSON with
        # spaces and quotes), and source it in every job.
        python -c "import os,shlex;ks=[k for k in os.environ if k in ('PATH','DEBUG','SECRET_KEY','ALLOWED_HOSTS') or k.startswith(('PLUGGY_','POSTGRES_','CORS_','DJANGO_'))];open('/etc/cron_env','w').write(''.join('export %s=%s\n'%(k,shlex.quote(os.environ[k])) for k in sorted(ks)))"
        chmod 600 /etc/cron_env
        # One sequenced, guarded run replaces five clock-triggered jobs. The old
        # 08:00/08:15/08:20/08:30/08:35 layout fired rebucket --apply and dedup
        # --apply regardless of whether the syncs had finished, or finished at
        # all — and rebucketing and DELETING on top of a partial sync is a
        # different failure class from running late.
        echo "$$SYNC_SCHEDULE . /etc/cron_env && cd /app && python manage.py run_finance_pipeline >> /proc/1/fd/1 2>&1" > /tmp/crontab
        echo "" >> /tmp/crontab
        crontab /tmp/crontab
        echo "cron started: $$SYNC_SCHEDULE"
        cron -f

volumes:
  vault_postgres_data:
  vault_static:
  vault_secrets:
